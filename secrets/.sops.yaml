# sops-nix key configuration
# 1. Generate age key: age-keygen -o key.txt (save to /persist/etc/age/key.txt)
# 2. Get public key: age-keygen -y key.txt
# 3. Replace age1xxx... below with your actual public key
# 4. Encrypt secrets: sops --encrypt secrets/secrets.yaml > secrets/secrets.enc.yaml

creation_rules:
  # Default: shared secrets encrypted with admin key
  - path_regex: secrets/.*\.yaml$
    age: >-
      age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # Per-host keys — add after first boot of each machine:
  #   cat /var/lib/sops-nix/key.txt | age-keygen -y /dev/stdin
  #
  # kernelcore (laptop) — fill after running kernelcore for the first time
  # - path_regex: secrets/hosts/kernelcore/.*
  #   age: >-
  #     age1<kernelcore-host-age-pubkey>
  #
  # desktop — fill after running desktop for the first time
  # - path_regex: secrets/hosts/desktop/.*
  #   age: >-
  #     age1<desktop-host-age-pubkey>
  #
  # voidnx-server template
  # - path_regex: secrets/hosts/server/.*
  #   age: >-
  #     age1<server-host-key>
  # voidnx-laptop template
  # - path_regex: secrets/hosts/laptop/.*
  #   age: >-
  #     age1<laptop-host-key>
