# VoidNxSEC secrets — MUST be encrypted with sops before commit
# This file is a PLAINTEXT TEMPLATE — do NOT commit without encrypting
#
# Encrypt: sops --encrypt --in-place secrets/secrets.yaml
# Decrypt: sops --decrypt secrets/secrets.yaml
#
# Generate password hashes:
#   mkpasswd -m sha-512
#   mkpasswd -m yescrypt
#
# Steps:
# 1. Edit this file with real values
# 2. Run: sops --encrypt --in-place secrets/secrets.yaml
# 3. Verify encryption: cat secrets/secrets.yaml (should show ENC[...])

user-password: "$6$REPLACE_WITH_REAL_HASH"
root-password: "$6$REPLACE_WITH_REAL_HASH"

# SSH host key (generated on first boot — update after bootstrap)
ssh-host-ed25519-key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_REAL_KEY
    -----END OPENSSH PRIVATE KEY-----
